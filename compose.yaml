services:
  empiremud:
    build: .
    image: empiremud:local
    container_name: empiremud
    restart: unless-stopped
    # autorun passes Docker's SIGTERM on to the game, which saves the world and exits
    # (about 12 s, measured 2026-11-09). The default 10 s stop timeout SIGKILLed it
    # mid-save; offen's nightly stop-during-backup uses this same timeout.
    stop_grace_period: 90s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    labels:
      - docker-volume-backup.stop-during-backup=true
    ports:
      - "4000:4000"
    volumes:
      - ./state/lib:/app/lib
      - ./state/log:/app/log
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
