services:
  empiremud:
    build: .
    image: empiremud:local
    container_name: empiremud
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=true
    ports:
      - "4000:4000"
    volumes:
      - ./state/lib:/app/lib
      - ./state/log:/app/log
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
